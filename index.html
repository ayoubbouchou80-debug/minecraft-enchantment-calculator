<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minecraft Enchantment Calculator</title>

<meta name="description"
content="Free Minecraft Enchantment Calculator. Check compatible and conflicting enchantments for swords, tools, armor, bows, tridents, maces and more.">

<meta name="keywords"
content="Minecraft enchantment calculator, Minecraft enchantments, enchantment compatibility, Minecraft Java, Minecraft Bedrock">

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#263b2c 0,#111614 35%,#090b0c 100%);
    color:#fff;
    min-height:100vh;
}

/* TOP BAR */

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(10,13,11,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #304336;
    padding:12px 18px;
}

.nav{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-weight:900;
    font-size:18px;
}

.logo span{
    color:#65d96f;
}

.nav-links{
    display:flex;
    gap:8px;
}

.nav-links button{
    width:auto;
    margin:0;
    padding:8px 13px;
    font-size:13px;
    background:#182019;
    border:1px solid #304336;
}

/* HERO */

.hero{
    text-align:center;
    padding:55px 18px 35px;
}

.hero-badge{
    display:inline-block;
    padding:7px 13px;
    border-radius:30px;
    background:#17321d;
    border:1px solid #315f39;
    color:#8df398;
    font-size:13px;
    margin-bottom:16px;
}

.hero h1{
    margin:0;
    font-size:clamp(30px,7vw,52px);
    line-height:1.1;
}

.hero h1 span{
    color:#67e271;
}

.hero p{
    max-width:650px;
    margin:18px auto 0;
    color:#aeb8b0;
    line-height:1.6;
}

/* MAIN */

.container{
    width:92%;
    max-width:1050px;
    margin:auto;
}

.card{
    background:rgba(20,26,22,.94);
    border:1px solid #2b3b30;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.22);
}

.card-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.card-title h2{
    margin:0;
    font-size:21px;
}

.badge{
    background:#203d27;
    border:1px solid #396a42;
    color:#8df398;
    border-radius:20px;
    padding:5px 9px;
    font-size:12px;
}

/* CONTROLS */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#dce7de;
}

select,
input[type="text"]{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #39473d;
    background:#0d110f;
    color:#fff;
    font-size:15px;
    outline:none;
}

select:focus,
input[type="text"]:focus{
    border-color:#67e271;
}

/* SEARCH */

.search{
    position:relative;
    margin-bottom:16px;
}

.search input{
    padding-left:42px;
}

.search-icon{
    position:absolute;
    left:14px;
    top:13px;
    font-size:17px;
}

/* ENCHANTMENTS */

.enchantments{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

.enchant{
    position:relative;
    background:#101512;
    border:1px solid #2d3930;
    border-radius:12px;
    padding:13px;
    transition:.18s;
}

.enchant:hover{
    transform:translateY(-2px);
    border-color:#4d8055;
}

.enchant.conflict{
    border-color:#a84444;
    background:#241313;
}

.enchant label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    margin:0;
}

.enchant input{
    width:18px;
    height:18px;
    accent-color:#55d761;
    flex-shrink:0;
}

.enchant-name{
    font-weight:bold;
}

.enchant-info{
    display:block;
    color:#7f8b82;
    font-size:12px;
    margin-top:4px;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:10px;
    margin-top:18px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px;
    color:#fff;
    background:#39a94b;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    filter:brightness(1.1);
    transform:translateY(-1px);
}

button.secondary{
    background:#1b251e;
    border:1px solid #344238;
}

button.danger{
    background:#351a1a;
    border:1px solid #673535;
}

/* COUNTER */

.counter{
    color:#98a49b;
    font-size:13px;
    margin-top:12px;
}

/* RESULT */

.result{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#0c100e;
    border:1px solid #2c382f;
    line-height:1.6;
}

.result.success{
    border-color:#397a43;
}

.result.error{
    border-color:#8a3b3b;
}

.result-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.success-text{
    color:#6ee879;
}

.warning-text{
    color:#ff7777;
}

.conflict-list{
    margin-top:10px;
}

.conflict-item{
    background:#251414;
    border:1px solid #653333;
    border-radius:8px;
    padding:9px;
    margin-top:7px;
    color:#ffaaaa;
}

/* QUICK TOOLS */

.tools{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.tool{
    padding:20px 12px;
    text-align:center;
    background:#111713;
    border:1px solid #2c3930;
    border-radius:13px;
}

.tool-icon{
    font-size:28px;
}

.tool h3{
    margin:9px 0 5px;
    font-size:15px;
}

.tool p{
    margin:0;
    color:#7f8982;
    font-size:12px;
}

/* INFO */

.info{
    color:#b3bdb5;
    line-height:1.75;
}

.info h2{
    color:#fff;
}

.info h3{
    color:#8eea96;
}

/* FOOTER */

footer{
    max-width:1050px;
    margin:30px auto 0;
    padding:30px 20px;
    border-top:1px solid #29342d;
    color:#727c74;
    text-align:center
}
</style>

</head>

<body>

</body>
</html>
