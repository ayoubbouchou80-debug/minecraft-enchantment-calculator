<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minecraft Anvil XP Optimizer</title>

<meta name="description"
content="Minecraft Anvil XP Optimizer. Find the cheapest enchantment book combining order and avoid Too Expensive!">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#26352b 0,#111712 45%,#090d0a 100%);
    color:#f4f4f4;
    min-height:100vh;
}

button,select,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1150px,94%);
    margin:auto;
}

/* HEADER */

header{
    border-bottom:1px solid #39483c;
    background:rgba(8,12,9,.88);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:20;
}

.nav{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:900;
    font-size:20px;
}

.logo img{
    width:38px;
    height:38px;
    image-rendering:pixelated;
    object-fit:contain;
}

.version{
    font-size:12px;
    color:#9bb39f;
    border:1px solid #425343;
    padding:6px 9px;
    border-radius:6px;
}

/* HERO */

.hero{
    padding:55px 0 35px;
    text-align:center;
}

.hero h1{
    font-size:clamp(32px,6vw,60px);
    line-height:1;
    margin-bottom:18px;
}

.hero h1 span{
    color:#75d35f;
}

.hero p{
    max-width:720px;
    margin:auto;
    color:#aebcaf;
    line-height:1.7;
}

/* CARDS */

.card{
    background:rgba(20,28,22,.94);
    border:1px solid #354337;
    border-radius:12px;
    padding:22px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.section-title{
    font-size:22px;
    margin-bottom:7px;
}

.section-subtitle{
    color:#89998c;
    font-size:14px;
    margin-bottom:20px;
}

/* ITEM SELECTOR */

.item-layout{
    display:grid;
    grid-template-columns:260px 1fr;
    gap:25px;
}

.item-preview{
    border:1px solid #3c4e40;
    border-radius:10px;
    background:
        linear-gradient(135deg,#172018,#0e130f);
    min-height:270px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
}

.item-preview img{
    width:125px;
    height:125px;
    object-fit:contain;
    image-rendering:pixelated;
    filter:drop-shadow(0 8px 15px rgba(0,0,0,.6));
}

.item-preview strong{
    font-size:18px;
}

.controls{
    display:grid;
    gap:15px;
}

.field{
    display:grid;
    gap:7px;
}

.field label{
    color:#9dac9f;
    font-size:13px;
}

select,
input[type="number"],
input[type="text"]{
    width:100%;
    background:#0d130f;
    color:white;
    border:1px solid #3c4d40;
    border-radius:7px;
    padding:12px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#6fc75b;
}

.grid-two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* BOOK BUILDER */

.builder{
    margin-top:22px;
}

.enchant-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;
    margin-bottom:18px;
}

.enchant-row{
    background:#111811;
    border:1px solid #2f3e32;
    border-radius:8px;
    padding:10px;
    display:grid;
    grid-template-columns:1fr 80px;
    gap:8px;
    align-items:center;
}

.enchant-name{
    font-weight:bold;
    font-size:14px;
}

.enchant-meta{
    color:#738176;
    font-size:11px;
    margin-top:3px;
}

.enchant-row select{
    padding:8px;
}

/* BUTTONS */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.btn{
    border:1px solid #455746;
    background:#182219;
    color:white;
    padding:12px 17px;
    border-radius:7px;
    font-weight:bold;
}

.btn:hover{
    background:#233124;
}

.btn-primary{
    background:#3d8e32;
    border-color:#61b751;
}

.btn-primary:hover{
    background:#4da63e;
}

.btn-danger{
    background:#632b2b;
    border-color:#914040;
}

/* BOOKS */

.books-section{
    margin-top:22px;
}

.books-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:12px;
}

.book-card{
    background:#101710;
    border:1px solid #354438;
    border-radius:10px;
    padding:13px;
    display:flex;
    gap:12px;
    align-items:center;
    position:relative;
}

.book-card img{
    width:52px;
    height:52px;
    image-rendering:pixelated;
    object-fit:contain;
}

.book-info{
    min-width:0;
}

.book-info strong{
    display:block;
    font-size:14px;
}

.book-info span{
    color:#89978c;
    font-size:12px;
}

.remove-book{
    position:absolute;
    right:7px;
    top:7px;
    border:0;
    background:transparent;
    color:#b66b6b;
    font-size:18px;
}

/* OPTIMIZE */

.optimize-box{
    margin-top:25px;
    text-align:center;
    padding:28px;
    border-radius:12px;
    background:
        linear-gradient(135deg,#19251b,#111711);
    border:1px solid #435646;
}

.optimize-button{
    width:100%;
    max-width:520px;
    padding:17px;
    border-radius:8px;
    border:1px solid #78d463;
    background:#3c9132;
    color:white;
    font-weight:900;
    font-size:17px;
}

.optimize-button:hover{
    background:#4ba73d;
}

/* RESULTS */

.results{
    margin-top:25px;
    display:none;
}

.result-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0;
}

.stat{
    background:#0d130e;
    border:1px solid #354337;
    border-radius:9px;
    padding:17px;
    text-align:center;
}

.stat span{
    display:block;
    color:#89988c;
    font-size:12px;
    margin-bottom:6px;
}

.stat strong{
    font-size:25px;
}

.success{
    color:#7bd967;
}

.warning{
    color:#e2a84e;
}

.error{
    color:#e16b6b;
}

/* STEPS */

.steps{
    display:grid;
    gap:15px;
}

.step{
    background:#0d130e;
    border:1px solid #354337;
    border-radius:11px;
    overflow:hidden;
}

.step-head{
    padding:11px 15px;
    background:#151e17;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.step-number{
    font-weight:900;
}

.step-cost{
    font-weight:900;
    color:#76d15f;
}

    display:grid;
