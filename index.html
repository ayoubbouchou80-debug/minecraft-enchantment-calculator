*{
    box-sizing:border-box;

html{
    scroll-behavior:smooth;

body{
    margin:0;

    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:min(900px,94%);

header{
    text-align:center;
    padding:30px 10px 20px;
}

.logo{
    font-size:40px;
    margin-bottom:5px;
}

    margin:0;
    color:#63ff63;

}

.subtitle{
    color:#888;
    margin-top:8px;
    font-size:14px;
}

/* ================= SECTIONS ================= */

section{
    background:#101610;
    border:1px solid #263d29;
    border-radius:15px;
    padding:18px;
    margin:16px 0;
}

    color:#65ff70;
    margin:0 0 16px;
    font-size:24px;
}

h3{
    color:#9cff9c;
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:13px;
}

.card{
    background:#0a100b;
    border:1px solid #263d29;
    border-radius:12px;
    padding:15px;
}
